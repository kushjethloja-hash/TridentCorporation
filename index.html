var DEFAULT_SIZES=["8*4 - 18MM","8*3 - 18MM","7*4 - 18MM","7*3 - 18MM","6*4 - 18MM","6*3 - 18MM","8*4 - 12MM","8*3 - 12MM","7*4 - 12MM","7*3 - 12MM","6*4 - 12MM","6*3 - 12MM"];
var K={c:"ply_clients",sc:"ply_sclients",s:"ply_sizes2",h:"ply_history2",sl:"ply_sales"};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

function applyData(d){d=d||{};
  clients=Array.isArray(d.clients)?d.clients:[];

  sizes=(Array.isArray(d.sizes)&&d.sizes.length)?d.sizes:DEFAULT_SIZES.slice();

function store(){cloudQueue()}

// ================= LOGIN + CLOUD (Firebase REST) =================
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sha256=(()=>{
  const KK=[],H0=[];
  const isPrime=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  for(let n=2;KK.length<64;n++){
    if(!isPrime(n))continue;
    if(H0.length<8)H0.push((Math.pow(n,1/2)%1)*4294967296|0);
    KK.push((Math.pow(n,1/3)%1)*4294967296|0);
  }
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  return msg=>{
    const bytes=new TextEncoder().encode(msg),l=bytes.length;
    const total=((l+9+63)>>6)<<6;
    const buf=new Uint8Array(total);buf.set(bytes);buf[l]=0x80;
    const dv=new DataView(buf.buffer);
    dv.setUint32(total-4,(l*8)>>>0);dv.setUint32(total-8,Math.floor(l*8/4294967296));
    const h=H0.slice(),w=new Array(64);
    for(let i=0;i<total;i+=64){
      for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
      for(let t=16;t<64;t++){
        const s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3);
        const s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10);
        w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
      }
      let [a,b,c,d,e,f,g,hh]=h;
      for(let t=0;t<64;t++){
        const t1=(hh+(rotr(e,6)^rotr(e,11)^rotr(e,25))+((e&f)^(~e&g))+KK[t]+w[t])|0;
        const t2=((rotr(a,2)^rotr(a,13)^rotr(a,22))+((a&b)^(a&c)^(b&c)))|0;
        hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      [a,b,c,d,e,f,g,hh].forEach((v,j)=>h[j]=(h[j]+v)|0);
    }
    return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
  };
})();
const hashPw=(salt,pw)=>{let h=salt+":"+pw;for(let i=0;i<1000;i++)h=sha256(h+salt);return h};

let user=null,uidFb=null,acct=null,baseTime="",authMode="login";
let idToken="",refreshTok="",tokenExp=0;
const FS_ROOT="https://firestore.googleapis.com/v1/projects/"+FIREBASE_CONFIG.projectId+"/databases/(default)/documents/accounts";
const NET_TIMEOUT=20000;
const toEmail=u=>u+"@plywood.app";
const syncEl=document.getElementById("sync");
let unsaved=false,saving=false,dirty=false;
function setSync(t,err){syncEl.textContent=t||"";syncEl.className=err?"err":""}
syncEl.onclick=()=>{if(unsaved)cloudQueue()};

async function jfetch(url,opts){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),NET_TIMEOUT);
  try{
    const r=await fetch(url,Object.assign({},opts,{signal:ctl.signal}));
    const txt=await r.text();
    let j=null;try{j=JSON.parse(txt)}catch(e){}
    if(!r.ok){
      const er=j&&j.error||{};
      const x=new Error(er.message||("HTTP "+r.status));
      x.code="http";x.status=r.status;x.msg=er.message||"";x.fstatus=er.status||"";
      throw x;
    }
    return j;
  }catch(e){
    if(e.code==="http")throw e;
    const x=new Error(e.name==="AbortError"?"timeout":"network");
    x.code=x.message;
    throw x;
  }finally{clearTimeout(timer)}
}
async function authCall(kind,email,pw){
  const j=await jfetch("https://identitytoolkit.googleapis.com/v1/accounts:"+kind+"?key="+FIREBASE_CONFIG.apiKey,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:pw,returnSecureToken:true})});
  idToken=j.idToken;refreshTok=j.refreshToken;
  tokenExp=Date.now()+(parseInt(j.expiresIn,10)||3600)*1000;
  return j.localId;
}
async function token(){
  if(Date.now()<tokenExp-60000)return idToken;
  const j=await jfetch("https://securetoken.googleapis.com/v1/token?key="+FIREBASE_CONFIG.apiKey,{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(refreshTok)});
  idToken=j.id_token;refreshTok=j.refresh_token;
  tokenExp=Date.now()+(parseInt(j.expires_in,10)||3600)*1000;
  return idToken;
}
async function fsReq(method,url,body){
  const tk=await token();
  return jfetch(url,{method:method,headers:{"Authorization":"Bearer "+tk,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
}
const parseDoc=j=>({
  salt:j.fields&&j.fields.salt&&j.fields.salt.stringValue||"",
  pin:j.fields&&j.fields.pin&&j.fields.pin.stringValue||"",
  data:j.fields&&j.fields.data&&j.fields.data.stringValue||"",
  updateTime:j.updateTime||""
});
const newDocFields=(salt,pin,data)=>({fields:{salt:{stringValue:salt},pin:{stringValue:pin},data:{stringValue:data}}});
async function docGet(){
  try{return parseDoc(await fsReq("GET",FS_ROOT+"/"+encodeURIComponent(uidFb)))}
  catch(e){
    if(e.code==="http"&&e.status===404&&!/database[^.]*does not exist/i.test(e.msg))return null;
    throw e;
  }
}
const isConflict=e=>e&&e.code==="http"&&(e.status===409||/FAILED_PRECONDITION|ABORTED/.test(e.fstatus));

function cloudQueue(){dirty=true;if(!saving)flush()}
async function flush(){
  if(!uidFb||!acct)return;
  saving=true;
  while(dirty){
    dirty=false;
    setSync("⏳ Saving…");
    try{
      const j=await fsReq("PATCH",FS_ROOT+"/"+encodeURIComponent(uidFb)+"?currentDocument.updateTime="+encodeURIComponent(baseTime)+"&updateMask.fieldPaths=data",
        {fields:{data:{stringValue:JSON.stringify(getData())}}});
      baseTime=j.updateTime;unsaved=false;
      setSync("☁️ Saved ✔");
    }catch(e){
      if(isConflict(e)){
        try{
          const d=await docGet();
          applyData(JSON.parse(d.data));baseTime=d.updateTime;unsaved=false;
          setSync("🔄 Newer data from another device loaded");
          alert("Dusre phone se naya data save hua tha, isliye screen refresh ho gayi. Apni last entry dobara karo.");
          render();
        }catch(e2){unsaved=true;setSync("⚠️ Not saved. Tap here to try again.",true)}
      }else{
        unsaved=true;
        setSync("⚠️ Not saved: "+authError(e).split(". ")[0]+". Tap here to try again.",true);
      }
      break;
    }
  }
  saving=false;
}
async function loadAccount(){
  applyData({});
  let d=await docGet();
  if(!d){
    let np="";
    while(!np){
      const r=prompt("Apna Delete Password set karo (entry delete karte waqt yahi password lagega):");
      if(r===null)throw new Error("Delete Password set karna zaroori hai. Dobara login karo.");
      np=r.trim();
    }
    const salt=uid()+uid();
    d=parseDoc(await fsReq("POST",FS_ROOT+"?documentId="+encodeURIComponent(uidFb),
      newDocFields(salt,hashPw(salt,"pin:"+np),JSON.stringify({}))));
  }
  acct={salt:d.salt,pin:d.pin};
  baseTime=d.updateTime;
  var db={};try{db=JSON.parse(d.data)||{}}catch(e){}
  applyData(db);
}
function startSession(){page="home";cur=null;sel=null;render();setSync("")}
function resetSession(){
  user=null;uidFb=null;acct=null;baseTime="";unsaved=false;authMode="login";acOpen=false;
  idToken="";refreshTok="";tokenExp=0;
  applyData({});setSync("");page="home";cur=null;sel=null;render();
}
function authError(e){
  const m=String(e&&e.msg||""),c=e&&e.code;
  if(c==="timeout")return "Server ne reply nahi diya. Internet check karo aur dobara try karo.";
  if(c==="network")return "Server tak nahi pahunch paye. Internet check karo.";
  if(/EMAIL_EXISTS/.test(m))return "Ye username pehle se hai. Dusra username chuno.";
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m))return "Username ya password galat hai.";
  if(/TOO_MANY_ATTEMPTS/.test(m))return "Bahut zyada galat try. Thodi der baad try karo.";
  if(/OPERATION_NOT_ALLOWED|CONFIGURATION_NOT_FOUND/.test(m))return "Firebase me Email/Password sign-in enable nahi hai. Authentication me Email/Password enable karo.";
  if(/WEAK_PASSWORD/.test(m))return "Password kam se kam 6 characters ka hona chahiye.";
  if(/API key not valid|API_KEY|API key/i.test(m))return "API key galat hai. Firebase config check karo.";
  if(/database[^.]*does not exist/i.test(m)&&e.status===404)return "Firestore Database nahi bana hai. Firebase me Firestore Database > Create database karo.";
  if(/SERVICE_DISABLED|has not been used|is disabled/i.test(m))return "Firestore enable nahi hai. Firebase me Firestore Database > Create database karo.";
  if(e&&(e.status===403||/PERMISSION_DENIED/.test(e.fstatus||"")))return "Database ne access deny kiya. Firestore Rules publish kiye hain?";
  return "Kuch galat hua: "+(m||(e&&e.message)||e);
}
function renderLogin(){
  const L=authMode==="login";
  app.innerHTML='<h1>Plywood — '+(L?"Login":"New Account")+'</h1><div class="card">'+
    '<label>Username</label><input id="lu" autocapitalize="none" autocomplete="username">'+
    '<label style="margin-top:12px">Password</label><input id="lp" type="password" autocomplete="'+(L?"current-password":"new-password")+'">'+
    (L?"":'<label style="margin-top:12px">Confirm Password</label><input id="lp2" type="password" autocomplete="new-password"><label style="margin-top:12px">Delete Password</label><input id="lpin" type="password" inputmode="numeric">')+
    '<button class="p big" style="font-size:17px;padding:14px;margin:16px 0 8px" id="go">'+(L?"Login":"Create Account")+'</button>'+
    '<button class="big" style="font-size:15px;padding:12px;margin:0" id="sw">'+(L?"➕ Create New Account":"← Back to Login")+'</button></div>';
  const go=document.getElementById("go");
  app.querySelectorAll("input").forEach(el=>el.onkeydown=e=>{if(e.key==="Enter")go.click()});
  document.getElementById("sw").onclick=()=>{authMode=L?"signup":"login";renderLogin()};
  go.onclick=async()=>{
    const u=document.getElementById("lu").value.trim().toLowerCase();
    const pw=document.getElementById("lp").value;
    if(!L&&(!u||!pw||!document.getElementById("lp2").value||!document.getElementById("lpin").value.trim())){alert("Sab details bharo.");return}
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){alert("Username 3 se 30 characters ka ho: sirf English letters, numbers, . _ - allowed.");return}
    if(pw.length<6){alert("Password kam se kam 6 characters ka ho.");return}
    let pin="";
    if(!L){
      if(pw!==document.getElementById("lp2").value){alert("Dono password match nahi karte.");return}
      pin=document.getElementById("lpin").value.trim();
    }
    go.disabled=true;
    try{
      go.textContent="Please wait…";
      uidFb=await authCall(L?"signInWithPassword":"signUp",toEmail(u),pw);
      if(!L){
        const salt=uid()+uid();
        await fsReq("POST",FS_ROOT+"?documentId="+encodeURIComponent(uidFb),newDocFields(salt,hashPw(salt,"pin:"+pin),JSON.stringify({})));
      }
      await loadAccount();
      user=u;
      startSession();
    }catch(e){
      const partial=!L&&uidFb;
      uidFb=null;idToken="";refreshTok="";
      alert(authError(e)+(partial?"\n\nAccount ban chuka hai. 'Back to Login' dabao aur wahi username/password se login karo.":""));
      go.disabled=false;go.textContent=L?"Login":"Create Account";
    }
  };
}

    '<button id="chgPw" style="width:100%;margin-top:8px">🔒 Change Login Password</button>'+

    acOpen=!acOpen;

  };

      alert("✅ Password change ho gaya. Agli baar naye password se login karo.");
    }catch(e){alert(authError(e))}
  };
  document.getElementById("chgPin").onclick=async function(){
    if(saving||dirty||unsaved){alert("Pehle save poora hone do.");return}

function buyRows(list){var r=[["Date","Client","Size","Price per Sqft","Pcs","Sqft","Total Amount"]],tp=0,ts=0,ta=0;
  list.forEach(function(e){var sf=sq(e.size,e.qty),a=Math.round((+e.price)*sf*100)/100;tp+=(+e.qty||0);ts+=sf;ta+=a;r.push([fmt(e.t),e.client,e.size,+e.price,+e.qty,sf,a])});
  r.push(["TOTAL","","","",tp,Math.round(ts*100)/100,Math.round(ta*100)/100]);return r}
function saleRows(list){var r=[["Date","Client","Size","Sale price per Sqft","Buy price per Sqft","Pcs","Sqft","Total Sale","Profit/Loss"]],tp=0,ts=0,ta=0,tl=0;
  list.forEach(function(e){var sf=sq(e.size,e.qty),bp=(e.buyPrice===null||e.buyPrice===undefined)?"":+e.buyPrice,a=Math.round((+e.price)*sf*100)/100,pl=bp===""?0:Math.round(((+e.price)-bp)*sf*100)/100;
    tp+=(+e.qty||0);ts+=sf;ta+=a;tl+=pl;r.push([fmt(e.t),e.client,e.size,+e.price,bp,+e.qty,sf,a,bp===""?"":pl])});
  r.push(["TOTAL","","","","",tp,Math.round(ts*100)/100,Math.round(ta*100)/100,Math.round(tl*100)/100]);return r}
function sheetName(n,used){var b=String(n).replace(/[\[\]:*?\/\\]/g," ").trim().slice(0,28)||"Client",x=b,k=2;while(used[x.toLowerCase()]){x=b+" "+k++}used[x.toLowerCase()]=1;return x}
function exportX(kind,client){
  var d=new Date(),ds=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  var sheets=[],file;
  if(kind==="stock"){
    var r=[["Size","Bought Pcs","Sold Pcs","Stock Pcs","Stock Sqft"]];
    sizes.slice().forEach(function(z){r.push([z,bought(z),soldQty(z),stockOf(z),sq(z,stockOf(z))])});
    sheets.push(["Available Stock",r]);file="Available-Stock-"+ds;
  }else{
    var isB=kind==="buy",src=(isB?hist:sales).slice().reverse(),mk=isB?buyRows:saleRows,lbl=isB?"Buy":"Sales";
    if(client){
      sheets.push([client,mk(src.filter(function(e){return e.client===client}))]);file=lbl+"-"+client.replace(/[^\w\-]+/g,"_")+"-"+ds;
    }else{
      sheets.push(["All "+lbl,mk(src)]);
      var names=[],seen={};(isB?clients:sclients).concat(src.map(function(e){return e.client})).forEach(function(n){if(!seen[n]){seen[n]=1;names.push(n)}});
      names.forEach(function(n){sheets.push([n,mk(src.filter(function(e){return e.client===n}))])});
      file=lbl+"-All-Clients-"+ds;
    }
  }
  try{
    if(window.XLSX){
      var wb=XLSX.utils.book_new(),used={};
      sheets.forEach(function(sh){var ws=XLSX.utils.aoa_to_sheet(sh[1]);ws["!cols"]=sh[1][0].map(function(){return{wch:18}});XLSX.utils.book_append_sheet(wb,ws,sheetName(sh[0],used))});
      XLSX.writeFile(wb,file+".xlsx");return;
    }
  }catch(e){}
  var csv="\ufeff"+sheets[0][1].map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=file+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function go(p,c){page=p;if(c!==undefined)cur=c;sel=null;render()}
function sep(i){return(/18MM$/.test(sizes[i])&&sizes[i+1]&&!/18MM$/.test(sizes[i+1]))?'<div style="flex-basis:100%;border-top:2px dashed var(--mu);margin:6px 0 10px"></div>':''}
function bought(z){return hist.reduce(function(a,e){return e.size===z?a+(+e.qty||0):a},0)}
function soldQty(z){return sales.reduce(function(a,e){return e.size===z?a+(+e.qty||0):a},0)}
function stockOf(z){return bought(z)-soldQty(z)}
function perSq(z){var m=String(z).match(/^\s*(\d+(?:\.\d+)?)\s*[*xX]\s*(\d+(?:\.\d+)?)/);return m?(+m[1])*(+m[2]):0}
function sq(z,q){return Math.round(perSq(z)*(+q||0)*100)/100}
function sqt(n){return Number(n).toLocaleString("en-IN",{maximumFractionDigits:2})+" Sqft"}
function totalStockSq(){return sizes.reduce(function(a,z){return a+sq(z,stockOf(z))},0)}
function lastBuy(z){for(var i=0;i<hist.length;i++){if(hist[i].size===z)return +hist[i].price}return null}
function fmt(t){var d=new Date(t);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+", "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true})}
function money(n){return "₹"+(Math.round(n*100)/100)}
function inr(n){return "₹"+(Math.round(n*100)/100).toLocaleString("en-IN",{maximumFractionDigits:2})}

      if(isNaN(qn)){el.className="pl mu";el.textContent="1 pc = "+perSq(z0)+" Sqft";return}
      if(isNaN(sp)||bp===null){el.className="pl ok2";el.textContent="Sqft: "+perSq(z0)+" × "+qn+" = "+sqt(sq(z0,qn));return}
      var pl=(sp-bp)*sq(z0,qn);
      el.className="pl "+(pl>=0?"ok2":"bad");
      el.textContent=(pl>=0?"Profit: ":"Loss: ")+money(Math.abs(pl))+"  (Total sale "+money(sp*sq(z0,qn))+")  ·  Sqft: "+sqt(sq(z0,qn));
    };
    $("spr").oninput=upd;$("sqt").oninput=upd;
  }
  if($("ssv"))$("ssv").onclick=function(){
    var p=$("spr").value,q=$("sqt").value,z=sizes[sel];
    if(p===""||q===""){ask("Please enter both sale price and quantity",null,true);return}
    var qn=Number(q),pn=Number(p);
    if(!isFinite(pn)||pn<0){ask("Enter a valid sale price",null,true);return}
    if(!Number.isInteger(qn)||qn<=0){ask("Quantity must be a whole number more than 0",null,true);return}
    var av=stockOf(z);
    if(av<=0){ask("No stock available for "+z,null,true);return}
    if(qn>av){ask("Only "+av+" pcs available in stock for "+z,null,true);return}
    sales.unshift({client:cur,size:z,price:String(pn),qty:String(qn),buyPrice:lastBuy(z),t:Date.now()});
    store(K.sl,sales);sel=null;render();
  };
  if(page==="home")bindAccountCard();
  bindDel();
}
render();
</script>
<script>
// ===== Theme picker =====
(function(){
  var TH=[["auto","Auto (device)","#9aa5b1"],["cream","Cream","#f1eee6"],["softdark","Soft Dark","#1c2128"],["sage","Sage Green","#5a8a68"],["ocean","Ocean Mist","#4a7fa8"],["midnight","Midnight Blue","#141b2d"],["amber","Amber Night","#a0692a"]];
  var KEY="ply_theme",root=document.documentElement,cur="auto";
  try{cur=localStorage.getItem(KEY)||"auto"}catch(e){}
  if(!TH.some(function(t){return t[0]===cur}))cur="auto";
  function apply(t){
    cur=t;
    if(t==="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",t);
    try{localStorage.setItem(KEY,t)}catch(e){}
  }
  apply(cur);
  var btn=document.createElement("button");btn.id="thBtn";btn.type="button";btn.textContent="🎨";btn.setAttribute("aria-label","Theme");
  document.body.appendChild(btn);
  var menu=null;
  function close(){if(menu){menu.remove();menu=null}}
  function open(){
    menu=document.createElement("div");menu.id="thMenu";
    TH.forEach(function(t){
      var b=document.createElement("button");b.type="button";if(t[0]===cur)b.className="on";
      b.innerHTML='<i style="background:'+t[2]+'"></i><span>'+t[1]+'</span>';
      b.onclick=function(e){e.stopPropagation();apply(t[0]);close()};
      menu.appendChild(b);
    });
    document.body.appendChild(menu);
  }
  btn.onclick=function(e){e.stopPropagation();menu?close():open()};
  document.addEventListener("click",function(e){if(menu&&!menu.contains(e.target))close()});
})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}
